# Supabase LOCAL ÉPHÉMÈRE pour les essais réels du module Football (authentification, MFA, Realtime).
# Utilisé par preparer-supabase-local.sh (machine locale ou GitHub Actions). Aucun projet distant :
# NE JAMAIS lancer « supabase link », « supabase login » ni « supabase db push » avec ce dossier.
# La structure de production est rejouée depuis supabase/historique (pas de migrations ici).
project_id = "koki-foot-essai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
# Durée de vie courte des jetons : permet l'essai « session expirée » avec un vrai jeton.
jwt_expiry = 60
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
