name: diag
on:
  push:
    branches: [diag/tmp-sql-logs]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Tests (annotations des échecs)
        run: |
          set +e
          npm test > /tmp/out.txt 2>&1
          code=$?
          grep -nE "^not ok|^\s+not ok|error:|Error:|expected|actual|message:" /tmp/out.txt | head -40 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-400)"; done
          grep -E "^# (tests|pass|fail)" /tmp/out.txt | while IFS= read -r l; do echo "::notice::$l"; done
          exit 0
